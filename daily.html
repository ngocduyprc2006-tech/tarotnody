<title>Lá bài hôm nay — Nody Tarot</title>
<meta name="description" content="Mỗi ngày một lá Tarot và một việc nhỏ để làm hôm nay. Miễn phí, không cần đăng nhập.">
<meta name="theme-color" content="#0a0714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

</head>

<body>
<div class="page">
  <header id="site-head"></header>
  <main class="wrap section">
    <div class="section-head center">
      <h2>Lá bài của riêng hôm nay</h2>
      <p>Một lá, một thông điệp, một việc nhỏ. Lá này cố định cho cả ngày —
         tải lại bao nhiêu lần cũng vẫn là nó.</p>
      <div class="streak" style="margin-top:14px">🐾 <b id="streakN">0</b> ngày liên tiếp</div>
    </div>

    <div class="daily-stage">
      <div class="daily-card" id="dailyCard"></div>
    </div>

    <div class="center" style="margin-top:20px">
      <button class="btn btn-moon" id="btnReveal">Lật lá bài</button>
    </div>

    <div class="narrow result hidden" id="dailyResult">
      <div id="dailyBody"></div>
    </div>
  </main>
  <footer id="site-foot"></footer>
</div>

<script type="module" src="js/firebase-init.js"></script>
<script src="js/i18n.js"></script>
