<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="js/perf.js"></script>
<title>Thần số học — tra cứu miễn phí | Nody Tarot</title>
<meta name="description" content="Tính đường đời, linh hồn, nhân cách, sứ mệnh và năm cá nhân từ họ tên và ngày sinh của bạn.">
<meta name="theme-color" content="#0a0714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/scene.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/tarot.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/upgrade.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
<div class="page">
  <header id="site-head"></header>
  <main class="wrap section">
    <div class="section-head center">
      <h2>Thần số học</h2>
      <p>Họ tên khai sinh và ngày sinh gộp lại thành năm con số. Chúng không quyết định
         bạn là ai, nhưng mô tả khá sát cái khuôn bạn được trao.</p>
    </div>

    <div class="narrow panel lit">
      <div class="field">
        <label for="numName">Họ và tên khai sinh</label>
        <input class="input" type="text" id="numName" placeholder="Nguyễn Thị Minh Anh" autocomplete="name">
      </div>
      <div class="field">
        <label for="numDob">Ngày sinh</label>
        <input class="input" type="date" id="numDob">
      </div>
      <button class="btn btn-moon btn-block" id="btnNum">Tra các con số của tôi</button>
      <p class="tiny mute" style="margin:14px 0 0">Dùng tên trên giấy khai sinh cho đúng nhất.
         Tên có dấu vẫn tính được, Cún tự bỏ dấu giúp bạn.</p>
    </div>

    <div class="narrow result hidden" id="numResult">
      <div id="numBody"></div>
    </div>
  </main>
  <footer id="site-foot"></footer>
</div>

<script type="module" src="js/firebase-init.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/scene.js"></script>
<script src="js/data/lore.js"></script>
<script src="js/numerology.js"></script>
</body>
</html>
