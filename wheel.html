<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vòng quay Cún Nody — một lời nhắc mỗi ngày | Nody Tarot</title>
<meta name="description" content="Quay một lượt mỗi ngày để nhận một lời nhắc nhỏ giúp ngày hôm nay nhẹ hơn.">
<meta name="theme-color" content="#0a0714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/scene.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/tarot.css">
<link rel="stylesheet" href="css/pages.css">
</head>

<body>
<div class="page">
  <header id="site-head"></header>
  <main class="wrap section">
    <div class="section-head center">
      <h2>Vòng quay của Cún Nody</h2>
      <p>Một lượt mỗi ngày. Không có giải thưởng nào cả — chỉ là một lời nhắc nhỏ,
         mà đôi khi lời nhắc nhỏ lại đổi được cả một ngày.</p>
    </div>

    <div class="wheel-wrap">
      <span class="wheel-pin"></span>
      <div class="wheel" id="wheel"></div>
      <div class="wheel-hub">🐾</div>
    </div>

    <div class="center" style="margin-top:24px">
      <button class="btn btn-moon" id="btnSpin">Quay một lượt</button>
    </div>

    <div class="narrow result hidden" id="wheelResult">
      <div id="wheelBody"></div>
    </div>
  </main>
  <footer id="site-foot"></footer>
</div>

<script type="module" src="js/firebase-init.js"></script>
<script src="js/shell.js"></script>
<script src="js/scene.js"></script>
<script src="js/wheel.js"></script>
</body>
</html>
